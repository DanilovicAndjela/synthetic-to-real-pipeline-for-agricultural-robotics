results_dir: /results
model:
  backbone: resnet_50
  train_backbone: true
  num_queries: 300
  num_select: 300
  num_feature_levels: 3
  return_interm_indices: [1, 2, 3]
dataset:
  train_data_sources:
    - image_dir: /isaac_output/images/train
      json_file: /isaac_output/annotations/instances_train.json
  val_data_sources:
    image_dir: /isaac_output/images/val
    json_file: /isaac_output/annotations/instances_val.json
  test_data_sources:
    image_dir: /isaac_output/images/val
    json_file: /isaac_output/annotations/instances_val.json
  infer_data_sources:
    image_dir: [/isaac_output/images/val]
    classmap: /isaac_output/annotations/classmap.txt
  num_classes: 3
  remap_mscoco_category: False
  eval_class_ids: [1, 2]
  batch_size: 4
  workers: 8
  dataset_type: serialized
  augmentation:
    train_spatial_size: [544, 960]
    eval_spatial_size: [544, 960]
    multi_scales: [480, 512, 544, 576, 608, 640, 672, 704]
    distortion_prob: 0.8
    iou_crop_prob: 0.8
    preserve_aspect_ratio: false
train:
  num_gpus: 1
  num_epochs: 100
  checkpoint_interval: 5
  validation_interval: 5
  precision: fp32
  optim:
    optimizer: AdamW
    lr: 0.0002
    lr_backbone: 0.00002
    weight_decay: 0.0001
    lr_scheduler: MultiStep
    lr_steps: [70, 90]
    lr_decay: 0.1
evaluate:
  checkpoint: /results/train/model_epoch_099.pth
  conf_threshold: 0.0
inference:
  checkpoint: /results/train/model_epoch_099.pth
  conf_threshold: 0.5
  input_width: 960
  input_height: 544
  color_map:
    crop: green
    weed: red
