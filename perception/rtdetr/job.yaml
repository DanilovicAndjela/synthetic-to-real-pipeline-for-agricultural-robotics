workerPoolSpecs:
  - machineSpec:
      machineType: g4-standard-48
      acceleratorType: NVIDIA_RTX_PRO_6000
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: europe-west4-docker.pkg.dev/konsulko-gpu-train/training/trainer:latest
      
      env:
        - name: ACTION
          value: "evaluate" # train/evaluate
      
        - name: EXPERIMENT
          value: "real_v2" # synthetic/real/sim2real

        - name: DATA_ROOT_URI
          value: "gs://konsulko-gpu-train-staging/data"

        - name: REAL_N
          value: "200"

        #- name: PRETRAINED_MODEL_URI
        #  value: "gs://konsulko-gpu-train-staging/runs/synthetic_v2/checkpoints/model_epoch_117-EMA.pth"

        - name: CHECKPOINT_URI
          value: "gs://konsulko-gpu-train-staging/runs/C_real_n200_lr1e4_e120_seed1337/checkpoints/model_epoch_101-EMA.pth"

          
        - name: SMOKE_TEST
          value: "false"

        - name: OMP_NUM_THREADS
          value: "1"
scheduling:
  strategy: SPOT
  timeout: 14400s
  restartJobOnWorkerRestart: false
serviceAccount: trainer@konsulko-gpu-train.iam.gserviceaccount.com
baseOutputDirectory:
  outputUriPrefix: gs://konsulko-gpu-train-staging/runs/C_real_n200_lr1e4_e120_seed1337_test/

