workerPoolSpecs:
  - machineSpec:
      machineType: g4-standard-48
      acceleratorType: NVIDIA_RTX_PRO_6000
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: europe-west4-docker.pkg.dev/<BUCKET_NAME>/training/trainer:latest
      
      env:
        - name: ACTION
          value: "train" # train/evaluate
      
        - name: EXPERIMENT
          value: "real" # synthetic/real/sim2real

        - name: DATA_ROOT_URI
          value: "gs://<BUCKET_NAME>/data"

        - name: REAL_N
          value: "337"

        #- name: PRETRAINED_MODEL_URI
        #  value: ""

        #- name: CHECKPOINT_URI
        #  value: "gs://konsulko-gpu-train-staging/runs/real_n337/checkpoints/model_epoch_119.pth"
          
        - name: SMOKE_TEST
          value: "false"

        - name: OMP_NUM_THREADS
          value: "1"
scheduling:
  strategy: SPOT
  timeout: 14400s
  restartJobOnWorkerRestart: false
serviceAccount: trainer@<BUCKET_NAME>.iam.gserviceaccount.com
baseOutputDirectory:
  outputUriPrefix: "gs://<BUCKET_NAME>/runs/real_n337/"

