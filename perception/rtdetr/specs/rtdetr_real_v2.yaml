results_dir: /workspace/results/C_real_v2

dataset:
  train_data_sources:
    - image_dir: /workspace/data/real_v2/train/images
      json_file: /workspace/data/real_v2/annotations/real_train_full.json

  val_data_sources:
    image_dir: /workspace/data/real_v2/val/images
    json_file: /workspace/data/real_v2/annotations/real_val.json

  test_data_sources:
    image_dir: /workspace/data/real_v2/test/images
    json_file: /workspace/data/real_v2/annotations/real_test.json

  num_classes: 3
  eval_class_ids: [1, 2]

  batch_size: 4
  workers: 4

  remap_mscoco_category: false
  pin_memory: true
  dataset_type: serialized

  augmentation:
    train_spatial_size: [544, 960]
    eval_spatial_size: [544, 960]

    # Explicit instead of relying on TAO defaults.
    multi_scales: [480, 512, 544, 576, 608]

    distortion_prob: 0.6
    iou_crop_prob: 0.4
    preserve_aspect_ratio: false

model:
  backbone: resnet_50
  train_backbone: true

  num_queries: 300
  num_select: 300

  return_interm_indices: [1, 2, 3]
  dec_layers: 6
  enc_layers: 1

train:
  # Full RT-DETR initialization, not only ResNet-50.
  pretrained_model_path: /workspace/weights/rtdetr_pretrained.pth

  num_epochs: 120

  checkpoint_interval: 2
  validation_interval: 1

  num_gpus: 1
  gpu_ids: [0]
  num_nodes: 1

  seed: 1337
  precision: bf16
  activation_checkpoint: true

  clip_grad_norm: 0.1

  enable_ema: true

  optim:
    optimizer: AdamW

    lr: 0.0001
    lr_backbone: 0.00001

    momentum: 0.9
    weight_decay: 0.0001

    lr_scheduler: MultiStep
    lr_steps: [80, 105]
    lr_decay: 0.1

    warmup_steps: 500

evaluate:
  conf_threshold: 0.0

export:
  input_channel: 3
  input_width: 960
  input_height: 544
  batch_size: 1
  opset_version: 17
  on_cpu: false
